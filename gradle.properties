org.gradle.caching=true
org.gradle.parallel=true

# Artifact versions. Independent per artifact; the release workflow overrides the one it publishes
# (tag building-blocks/vX.Y.Z, archunit/vX.Y.Z, spring/vX.Y.Z, archunit-spring-modulith/vX.Y.Z). Keep
# buildingBlocksVersion and archunitVersion at the latest released version while another artifact
# is released — dca-archunit and dca-spring depend on exactly buildingBlocksVersion,
# dca-archunit-spring-modulith on exactly archunitVersion.
buildingBlocksVersion=0.2.0
archunitVersion=0.4.0
dcaSpringVersion=0.2.0-SNAPSHOT
archunitSpringModulithVersion=0.2.0-SNAPSHOT
