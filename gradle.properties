org.gradle.caching=true
org.gradle.parallel=true

# Artifact versions. Independent per artifact; the release workflow overrides the one it publishes
# (tag building-blocks/vX.Y.Z, archunit/vX.Y.Z, spring/vX.Y.Z, archunit-spring-modulith/vX.Y.Z). An
# artifact with unreleased changes carries the version it will ship as, with -SNAPSHOT, so that a
# locally built jar is never mistaken for the released one of the same number. Before releasing an
# artifact, pin every artifact it depends on to a released version — dca-archunit and dca-spring
# depend on exactly buildingBlocksVersion, dca-archunit-spring-modulith on exactly archunitVersion;
# the build refuses a release that would depend on a snapshot.
buildingBlocksVersion=0.3.0
archunitVersion=0.5.0-SNAPSHOT
dcaSpringVersion=0.2.0-SNAPSHOT
archunitSpringModulithVersion=0.2.0-SNAPSHOT
