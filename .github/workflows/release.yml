name: Release

# Tag-driven, one artifact per tag:
#   building-blocks/v1.2.0     -> :dca-building-blocks 1.2.0
#   archunit/v3.4.1            -> :dca-archunit 3.4.1
#   spring/v0.1.0              -> :dca-spring 0.1.0
#   archunit-modulith/v0.1.0   -> :dca-archunit-modulith 0.1.0
#
# Publishing to Maven Central happens on the maintainer's machine (./scripts/release.sh) so the GPG
# signing key never reaches CI. This workflow verifies the tagged version and publishes the GitHub
# release; the tag is pushed after the artifact is on Central.
on:
  push:
    tags:
      - 'building-blocks/v*'
      - 'archunit/v*'
      - 'spring/v*'
      - 'archunit-modulith/v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve artifact and version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"                 # e.g. archunit/v1.2.3
          PREFIX="${TAG%%/*}"                     # archunit
          VERSION="${TAG##*/v}"                   # 1.2.3
          case "$PREFIX" in
            building-blocks)   PROJECT=dca-building-blocks;   PROP=buildingBlocksVersion ;;
            archunit)          PROJECT=dca-archunit;          PROP=archunitVersion ;;
            spring)            PROJECT=dca-spring;            PROP=dcaSpringVersion ;;
            archunit-modulith) PROJECT=dca-archunit-modulith; PROP=archunitModulithVersion ;;
            *) echo "unknown tag prefix $PREFIX"; exit 1 ;;
          esac
          case "$VERSION" in
            *-SNAPSHOT) echo "a release tag must not carry a snapshot version: $VERSION"; exit 1 ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a semantic version: $VERSION"; exit 1 ;;
          esac
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "prop=$PROP"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew :${{ steps.tag.outputs.project }}:build -P${{ steps.tag.outputs.prop }}=${{ steps.tag.outputs.version }} --no-daemon

      - name: Changelog names this version
        run: grep -q "^## \[${{ steps.tag.outputs.version }}\]" ${{ steps.tag.outputs.project }}/CHANGELOG.md

      - name: Artifact is on Maven Central
        run: |
          URL="https://repo1.maven.org/maven2/dev/domaincentric/${{ steps.tag.outputs.project }}/${{ steps.tag.outputs.version }}/${{ steps.tag.outputs.project }}-${{ steps.tag.outputs.version }}.pom"
          for i in $(seq 1 30); do
            if curl -fsSL -o /dev/null "$URL"; then echo "published: $URL"; exit 0; fi
            echo "not on Central yet, retrying in 60s ($i/30)"; sleep 60
          done
          echo "still not on Central after 30 minutes: $URL"; exit 1

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.project }} ${{ steps.tag.outputs.version }}
          body: See ${{ steps.tag.outputs.project }}/CHANGELOG.md
          files: ${{ steps.tag.outputs.project }}/build/libs/*.jar
