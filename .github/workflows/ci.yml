name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - name: Rule catalog is up to date
        run: |
          ./gradlew :dca-archunit:rulesCatalog --no-daemon
          git diff --exit-code -- rules.json RULES.md
      - name: Publishing config is valid
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: Minimal consumer sample
        working-directory: samples/minimal-consumer
        run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
