# Configuration of the DCA rule catalog for this project.
# Everything here is also available as a fluent API on DcaRuleSelection.

# Rules that do not apply. They still show up in the report, aborted with their reason.
dca.rules.off               = DCA-NAM-002
dca.rule.DCA-NAM-002.reason = this sample has no DI framework, so use cases carry no @Service

# Rules the project is working towards: reported, but they do not fail the build.
# dca.rules.warn            = DCA-TAC-009
# dca.rule.DCA-TAC-009.reason = value objects are being made final step by step

# A documented exception to an otherwise enforced rule (regular expression on the violation).
# dca.rule.DCA-STR-003.ignore = .*legacy.*

# Accept today's violations as a baseline and fail only on new ones.
# dca.rules.freeze          = DCA-ONI-002
# dca.rules.freeze.store    = arch/frozen

# Narrow the run while adopting the catalog:
# dca.rules.sets            = cycles,layered,hexagonal
