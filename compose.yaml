# docker compose run --rm build      → ./gradlew build (compiles, tests, javadoc)
# docker compose run --rm catalog    → renders rules.json / RULES.md into the checkout
# docker compose run --rm gradle <task>  → any Gradle task, dependencies cached in a volume
# docker compose --profile ci build  → CI-style check: the image builds only if everything is green
#
# The tool services sit in the `tools` profile and the image in `ci`: `docker compose up` and
# `docker compose build` start and build nothing on their own, and `run --rm <tool>` pulls only the
# JDK image. Each tool service is spelled out in full — podman-compose 1.6 cannot resolve `extends`.
services:
  gradle:
    image: docker.io/library/eclipse-temurin:21-jdk
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: ["./gradlew", "--no-daemon"]
    command: ["build"]

  build:
    image: docker.io/library/eclipse-temurin:21-jdk
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: ["./gradlew", "--no-daemon"]
    command: ["build"]

  catalog:
    image: docker.io/library/eclipse-temurin:21-jdk
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: ["./gradlew", "--no-daemon"]
    command: [":dca-archunit:rulesCatalog"]

  check:
    build: .
    image: dca-java
    profiles: [ci]

volumes:
  gradle-cache:
